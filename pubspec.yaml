name: eventsphere_last
description: EventSphere - full event management app with reviews, FAQ, roles
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # Supabase
  supabase_flutter: ^1.3.0

  # For picking image
  image_picker: ^0.8.7+4

  # For date formatting
  intl: ^0.18.0

  # Explicitly pin Apple Sign In plugin to a version compatible with current Flutter/Dart
  sign_in_with_apple: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
